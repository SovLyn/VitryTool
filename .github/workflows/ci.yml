name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (fmt + clippy + test)
    # 固定 22.04：与 CD release.yml 一致（webkit2gtk-4.1 依赖链在 24.04 上有包名差异）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libglib2.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Backend tests (dt)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend (vitest + tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Node 22：jsdom 30 的 undici 8 依赖 `webidl.util.markAsUncloneable`（Node 22+ API），
          # Node 20 下 vitest forks worker 启动崩溃（与本地开发版本一致）
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Frontend tests (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build
