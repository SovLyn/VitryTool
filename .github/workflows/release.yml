name: Release

# CD：打 tag（v*）触发 → 桌面三平台构建安装包 + Android APK → GitHub Release 草稿
# （人工确认后发布）。0.2.9 起含 Android 目标（见 docs/api/mobile.md）。
# 发布流程：git tag v0.2.9 && git push origin v0.2.9
# 说明：tag 即版本（本项目契约 docs/versioning.md），不引入 release 分支/自动打 tag；
#       显式 target 矩阵（与各 runner 宿主架构一致）、timeout、fetch-depth、结构化 releaseBody。
on:
  push:
    tags:
      - "v*"
  # 手动触发：tag 已存在但 release 未创建/需重跑时，可在 Actions 页手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与 CI 一致：Node 22（jsdom 30 的 undici 8 需要 Node 22+ 的 webidl API）
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          # v__VERSION__ 由 tauri-action 从 package.json 版本自动替换（tag 触发与手动触发均正确）
          tagName: v__VERSION__
          releaseName: "VitryTool v__VERSION__"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## 变更

            - 剪贴板历史（文本 / HTML / RTF / 图片 / 文件）与收藏
            - 快速粘贴（全局快捷键 + 置顶小屏）
            - 局域网剪贴板同步（lan-sync，libp2p + mDNS）
            - 主题（亮色 / 暗色 / 跟随系统）与设置页
            - 系统托盘（广播 / 接收快速开关）与窗口状态记忆
            - 全局通知系统（notify）
            - **移动端（Android）**：收件箱接收 + 写剪贴板（见 docs/features/mobile.md）
            - 详细变更见 [CHANGELOG.md](CHANGELOG.md)

            ## 校验

            | 平台 | SHA256 |
            |------|--------|
            | Windows | 见附件 |
            | macOS | 见附件 |
            | Linux | 见附件 |
            | Android (APK) | 见附件 |

  android:
    name: Android (APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install NDK (tauri 模板锁定版本)
        run: sdkmanager "ndk;26.1.10909125"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Android release 签名（0.2.9，见 docs/api/mobile.md）：
      # 在仓库 Settings → Secrets 配置后启用正式签名：
      #   ANDROID_KEYSTORE_BASE64    = keystore 文件 base64（keytool -genkeypair 生成后 base64）
      #   ANDROID_KEYSTORE_PASSWORD  = 密钥库口令
      #   ANDROID_KEY_ALIAS          = 别名
      #   ANDROID_KEY_PASSWORD       = 密钥口令
      # 未配置时以 debug 签名构建（仅自测，不可发布）。
      - name: Configure release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/keystore.p12
            # printf 输出无缩进（heredoc 会因 YAML 缩进写入前导空格导致 properties 解析失败）；
            # storeFile 相对 app/ 模块目录解析（build.gradle.kts: file()），
            # keystore.p12 在 gen/android/ → 用 ../ 上跳一级
            printf 'storeFile=../keystore.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
              > src-tauri/gen/android/keystore.properties
            echo "keystore configured"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set, building unsigned APK (self-test only)"
          fi

      - name: Build Android APK
        run: pnpm tauri android build --apk

      # 上传到与 desktop job 相同的 Release 草稿（同 tag：先到先建、后到更新）
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --generate-notes 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" src-tauri/gen/android/app/build/outputs/apk/*/*.apk --clobber
