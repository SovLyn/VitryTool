name: Release

# CD：打 tag（v*）触发 → 三平台构建安装包 → GitHub Release 草稿（人工确认后发布）。
# 发布流程：git tag v0.2.7 && git push origin v0.2.7
# 说明：tag 即版本（本项目契约 docs/versioning.md），不引入 release 分支/自动打 tag；
#       显式 target 矩阵（与各 runner 宿主架构一致）、timeout、fetch-depth、结构化 releaseBody。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与 CI 一致：Node 22（jsdom 30 的 undici 8 需要 Node 22+ 的 webidl API）
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: "VitryTool ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## 变更

            - 剪贴板历史（文本 / HTML / RTF / 图片 / 文件）与收藏
            - 快速粘贴（全局快捷键 + 置顶小屏）
            - 局域网剪贴板同步（lan-sync，libp2p + mDNS）
            - 主题（亮色 / 暗色 / 跟随系统）与设置页
            - 系统托盘（广播 / 接收快速开关）与窗口状态记忆
            - 详细变更见 [CHANGELOG.md](CHANGELOG.md)

            ## 校验

            | 平台 | SHA256 |
            |------|--------|
            | Windows | 见附件 |
            | macOS | 见附件 |
            | Linux | 见附件 |
