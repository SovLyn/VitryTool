[package]
name = "vitrytool"
version = "0.2.9"
description = "A handy tool for lan information sharing and other staff"
authors = ["SovLyn"]
edition = "2021"
repository = "https://github.com/SovLyn/VitryTool"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vitrytool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.45"
uuid = { version = "1.24.0", features = ["v4"] }
log = "0.4.33"
tauri-plugin-log = "2.9.0"
# 局域网同步（lan-sync，0.2.5）
libp2p = { version = "0.56", features = [
    "tokio",
    "macros",
    "mdns",
    "gossipsub",
    "tcp",
    "noise",
    "tls",
    "yamux",
    "quic",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"

# ---- 平台差异依赖（0.2.9 移动端，契约 docs/api/mobile.md 6） ----
# 桌面：剪贴板监听 + 全局快捷键 + 窗口状态 + 单实例（均为桌面专属插件）；
# 移动端：官方 clipboard-manager 写剪贴板（clipboard-x 底层 clipboard-rs 无 Android 实现）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-x = "2.0.2"
tauri-plugin-store = "2.4.4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2.4.4"
tauri-plugin-clipboard-manager = "2"

